name: my_flutter_app
description: "A new Flutter project created for Web 2 APK Build."

# Menentukan versi rilis dan build aplikasi Anda
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Sesuaikan dengan versi Flutter SDK yang Anda gunakan

dependencies:
  flutter:
    sdk: flutter

  # Tambahkan library/package pendukung di bawah ini jika diperlukan, contoh:
  # cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Jika aplikasi Anda menggunakan aset gambar atau font, aktifkan bagian ini:
  # assets:
  #   - assets/images/
